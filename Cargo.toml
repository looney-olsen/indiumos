[workspace]
members = ["crates/indium-core", "crates/indium-shell"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Gangster-Prince-Productions/indium-os"
authors = ["Indium OS contributors"]

[profile.release]
opt-level = "s"      # small and fast enough, important on 2 GB machines
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
