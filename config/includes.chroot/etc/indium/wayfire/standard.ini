# Wayfire config for the Standard profile (GPU, light effects).
[core]
plugins = \
  autostart \
  command \
  decoration \
  foreign-toplevel \
  grid \
  idle \
  move \
  resize \
  place \
  window-rules \
  wm-actions \
  animate \
  switcher
vwidth = 1
vheight = 1

[autostart]
autostart_wf_shell = false
wallpaper = swaybg -c e8eef5 -i /usr/share/backgrounds/indium/default.jpg -m fill
polkit = lxpolkit
shell = indium-shell-session

[command]
binding_launcher = <super> KEY_SPACE
command_launcher = indium-shell --toggle-launcher
binding_terminal = <super> KEY_ENTER
command_terminal = foot

[animate]
open_animation = zoom
close_animation = zoom
duration = 200

[decoration]
border_size = 0
title_height = 28
font = Inter

[input]
xkb_layout = us
